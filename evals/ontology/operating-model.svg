<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">OmniSeed operating model evaluation</title>
  <description id="description">Intent becomes governed desired state, OmniSeed reconciles primitive realisations, and evidence describes observed company state. Lily is one replaceable actor.</description>
  <rect width="1200" height="630" fill="#f5f7f4"/>
  <g font-family="Arial, sans-serif" fill="#153d2d">
    <text x="60" y="70" font-size="38" font-weight="700">Company as Code</text>
    <text x="60" y="125" font-size="25">Intent → Capability → desired state in Git</text>
    <rect x="60" y="170" width="300" height="130" rx="16" fill="#dcebe3"/>
    <text x="90" y="220" font-size="28" font-weight="700">Company</text>
    <text x="90" y="260" font-size="20">durable identity</text>
    <rect x="450" y="170" width="300" height="130" rx="16" fill="#c9e2d4"/>
    <text x="480" y="220" font-size="28" font-weight="700">OmniSeed</text>
    <text x="480" y="260" font-size="20">plan · apply · observe · reconcile</text>
    <rect x="840" y="170" width="300" height="130" rx="16" fill="#dcebe3"/>
    <text x="870" y="220" font-size="28" font-weight="700">Real company</text>
    <text x="870" y="260" font-size="20">observed state + evidence</text>
    <text x="370" y="245" font-size="42">→</text>
    <text x="760" y="245" font-size="42">→</text>
    <text x="60" y="390" font-size="25">Capability → Requirement → Realisation → Primitive → Provider organisation → product/resource</text>
    <text x="60" y="455" font-size="25">Drift = evidenced difference between desired and observed state</text>
    <text x="60" y="520" font-size="25">Company Change = governed proposal, not proof that reality changed</text>
    <text x="60" y="585" font-size="25">Lily = one replaceable authorised Actor, not CEO, company, or OmniSeed</text>
  </g>
</svg>
